; Endfield - "Phonograph" color scheme for Spicetify.
; Colours are exact hex from the approved mockup (ds-spotify-v2.html) and house style (ds-shell.css).
; Accent note: in the mockup the lavender accent follows the album art (the featured slab is tinted
; per album). Spicetify color.ini is static per scheme and cannot track album art, so the accent is
; fixed to the house lavender #CFC6F4 here. See spotify/README.md.

[Endfield]
text           = #F1F1F4
subtext        = #7D8089
main           = #0F0F10
sidebar        = #15161A
player         = #0C0C0E
card           = #1A1B1F
shadow         = #0B0B0C
selected-row   = #2D2D36
button         = #E8E9EE
button-active  = #FFFA00
button-disabled= #55575E
tab-active     = #2D2D36
notification   = #FF9E2C
notification-error = #D91E36
misc           = #55575E
accent         = #CFC6F4
highlight      = #26282D
