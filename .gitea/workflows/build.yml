# Per-package workflow: only pkgname + deps live here; the gates are in pkgs/packaging's rust-pkg.yml.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  pkg:
    uses: pkgs/packaging/.gitea/workflows/rust-pkg.yml@main
    with:
      pkgname: phonograph
      # makepkg runs without sudo in CI: depends + the python makedepend must be preinstalled here
      extra_pacman_deps: "python spotify-launcher cava noto-fonts-cjk ttf-jetbrains-mono inter-font libnotify"
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
